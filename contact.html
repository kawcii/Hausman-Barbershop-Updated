<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hausman Barber Shop - Contact & Booking</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-container">
        <h1>Hausman Barber Shop</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact & Booking</a></li>
            </ul>
        </nav>
    </div>
</header>

    <main>
        <section>
            <h2>Book an Appointment</h2>
            <form action="#" method="post">
                <label for="fullname">Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="service">Service:</label>
                <select id="service" name="service" required>
                    <option value="">-- Choose a Service --</option>
                    <option value="Haircut">Classic Haircut</option>
                    <option value="Fade">Skin Fade / Taper</option>
                    <option value="Beard">Beard Trim & Shape</option>
                    <option value="Beard">Hot towel shave</option>
                </select>

                <label for="date">Preferred Date:</label>
                <input type="date" id="date" name="date" required>

                <button type="submit">Confirm Booking</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hausman Barber Shop. All rights reserved.</p>
    </footer>
</body>
</html>
